name: Server container

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  TZ: UTC

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint

  container:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build the actual Linux AMD64 runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: learnharness:verify
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check runtime, streaming, renderers and restart persistence
        run: |
          docker volume create learnharness-smoke
          docker run -d --name learnharness-smoke \
            --cap-drop ALL --security-opt no-new-privileges \
            -e LH_DATA_DIR=/var/lib/learnharness/fresh-data \
            --mount source=learnharness-smoke,target=/var/lib/learnharness \
            learnharness:verify
          docker exec -e LH_CONTAINER_SMOKE=1 learnharness-smoke node scripts/smoke-container.mjs
          docker restart --timeout 60 learnharness-smoke
          docker exec -e LH_CONTAINER_SMOKE=1 learnharness-smoke node scripts/smoke-container.mjs --after-restart
      - name: Container logs
        if: failure()
        run: docker logs --tail 150 learnharness-smoke || true
      - name: Remove disposable test container and volume
        if: always()
        run: |
          docker rm -f learnharness-smoke || true
          docker volume rm learnharness-smoke || true
      # The owner explicitly chose this public fork. Other forks, PRs, and
      # non-main manual runs never publish. The owner also approved a public
      # image; application access remains controlled separately by Tailscale.
      - name: Verify the owner-approved public image package
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'baruchavi/learnharness'
        uses: actions/github-script@v9
        with:
          script: |
            const {data} = await github.rest.packages.getPackageForUser({
              username: "baruchavi", package_type: "container", package_name: "learnharness",
            });
            if (data.visibility !== "public") {
              throw new Error("Expected the owner-approved public ghcr.io/baruchavi/learnharness package.");
            }
      - name: Sign in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'baruchavi/learnharness'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the verified image under an immutable source tag
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'baruchavi/learnharness'
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}"
          docker tag learnharness:verify "$image"
          docker push "$image"
          echo "Published $image" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify the published package is public
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'baruchavi/learnharness'
        uses: actions/github-script@v9
        with:
          script: |
            const {data} = await github.rest.packages.getPackageForUser({
              username: "baruchavi", package_type: "container", package_name: "learnharness",
            });
            if (data.visibility !== "public") {
              throw new Error("Published package does not match the owner-approved public visibility.");
            }
            core.info("Verified ghcr.io/baruchavi/learnharness is public. Application access is managed separately.");
      - name: Explain skipped publication
        if: github.event_name != 'pull_request' && (github.ref != 'refs/heads/main' || github.repository != 'baruchavi/learnharness')
        run: echo "Image verified locally. Publication requires main in baruchavi/learnharness." >> "$GITHUB_STEP_SUMMARY"
